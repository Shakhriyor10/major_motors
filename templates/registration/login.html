<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход · Major Motors</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    :root {
      --brand-red: #d62828;
      --brand-red-dark: #a4161a;
      --brand-red-soft: #ffe5e5;
      --brand-red-glow: rgba(214, 40, 40, 0.2);
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #fff1f1 0%, #f7f7fa 45%, #f3f4f7 100%);
    }
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .login-card {
      max-width: 480px;
      width: 100%;
      border: 0;
      border-radius: 1.25rem;
      box-shadow: 0 20px 50px rgba(31, 41, 55, 0.15);
      border: 1px solid rgba(214, 40, 40, 0.12);
    }
    .login-card .card-header {
      border: 0;
      background: linear-gradient(120deg, var(--brand-red-dark), var(--brand-red));
      color: #fff;
      padding: 2.5rem;
      border-top-left-radius: 1.25rem;
      border-top-right-radius: 1.25rem;
    }
    .login-card .card-body {
      padding: 2.5rem;
    }
    .login-input {
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      border: 1px solid #d7dce3;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .login-input:focus {
      border-color: var(--brand-red);
      box-shadow: 0 0 0 0.2rem rgba(214, 40, 40, 0.2);
    }
    .login-btn {
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-weight: 600;
      background: var(--brand-red);
      border-color: var(--brand-red);
      box-shadow: 0 12px 24px var(--brand-red-glow);
    }
    .login-btn:hover {
      background: var(--brand-red-dark);
      border-color: var(--brand-red-dark);
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card">
      <div class="card-header">
        <div class="brand-pill mb-3">
          <span>Major Motors</span>
        </div>
        <h1 class="h3 mb-1 fw-bold">Добро пожаловать</h1>
        <p class="mb-0 text-white-50">Авторизуйтесь, чтобы продолжить работу с системой.</p>
      </div>
      <div class="card-body">
        {% if form.errors %}
          <div class="alert alert-danger">
            Неверный логин или пароль. Проверьте данные и попробуйте снова.
          </div>
        {% endif %}
        <form method="post" class="vstack gap-3">
          {% csrf_token %}
          <div>
            <label class="form-label" for="id_username">Логин</label>
            <input
              type="text"
              name="username"
              id="id_username"
              autocomplete="username"
              class="form-control login-input"
              value="{{ form.username.value|default:'' }}"
              required
            >
          </div>
          <div>
            <label class="form-label" for="id_password">Пароль</label>
            <input
              type="password"
              name="password"
              id="id_password"
              autocomplete="current-password"
              class="form-control login-input"
              required
            >
          </div>
          <button class="btn btn-dark login-btn w-100" type="submit">Войти</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
