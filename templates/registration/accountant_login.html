<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102f42"><title>Вход бухгалтера · Major Motors</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#0b2433,#18445a);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#172b3a}.login{width:min(100%,430px);padding:32px;background:#fff;border-radius:24px;box-shadow:0 24px 80px #06172366}.brand{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#16728b}.mark{display:grid;place-items:center;width:54px;height:54px;border-radius:17px;background:#e5f3f5;color:#16728b;font-size:25px;margin-bottom:22px}h1{font-size:26px;line-height:1.2;margin:8px 0}p{margin:0 0 25px;color:#71808c}.field{margin:16px 0}.field label{display:block;font-weight:650;font-size:14px;margin-bottom:7px}.field input{width:100%;height:48px;padding:0 13px;border:1px solid #d5dee4;border-radius:12px;font:inherit;outline:none}.field input:focus{border-color:#16728b;box-shadow:0 0 0 3px #16728b22}button{width:100%;height:50px;border:0;border-radius:12px;background:#123c50;color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}.error{background:#fff0f0;color:#9e2828;padding:11px 13px;border-radius:11px;font-size:14px;margin-bottom:15px}
  </style>
</head>
<body><main class="login"><div class="mark">₮</div><div class="brand">Major Motors · Финансы</div><h1>Кабинет бухгалтера</h1><p>Войдите с учётной записью главного бухгалтера.</p>
  {% if error %}<div class="error">Неверный логин или пароль, либо у пользователя нет доступа к кабинету.</div>{% endif %}
  <form method="post">{% csrf_token %}<div class="field"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button type="submit">Войти в кабинет</button></form>
</main></body></html>
