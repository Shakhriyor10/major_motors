<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Major Motors CRM{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f6f7fb;
      color: #1f2937;
    }
    body {
      margin: 0;
    }
    header {
      background: #111827;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 16px;
      font-weight: 500;
    }
    main {
      padding: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    h1, h2, h3 {
      margin-top: 0;
    }
    footer {
      text-align: center;
      padding: 16px;
      color: #6b7280;
    }
    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 12px;
      margin-right: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }
    th {
      color: #6b7280;
      font-weight: 600;
    }
    .muted {
      color: #6b7280;
      font-size: 13px;
    }
    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 8px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 12px;
    }
  </style>
  {% block extra_styles %}{% endblock %}
</head>
<body>
  <header>
    <div>
      <strong>Major Motors CRM</strong>
    </div>
    <nav>
      <a href="/">Главная</a>
      <a href="/dashboard/">Дашборд</a>
      <a href="/customers/">Клиенты</a>
      <a href="/leads/">Лиды</a>
      <a href="/inventory/">Склад</a>
      <a href="/deals/">Сделки</a>
      <a href="/cash/">Касса</a>
      <a href="/roles/">Роли</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    CRM автосалона · версия демо интерфейса
  </footer>
</body>
</html>
