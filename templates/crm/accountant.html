<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f42">
  <title>Бухгалтерия · Major Motors</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172b3a;background:#f3f6f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.top{background:linear-gradient(110deg,#102f42,#176078);color:#fff;padding:18px max(20px,calc((100% - 1200px)/2));display:flex;align-items:center;justify-content:flex-end;gap:16px}.brand{font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:#badbe2;font-weight:750}.top h1{font-size:22px;margin:4px 0 0}.logout{color:#fff;border:1px solid #ffffff66;border-radius:10px;text-decoration:none;padding:9px 13px;font-weight:650;background:none;cursor:pointer;font:inherit}.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px}.toolbar{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-bottom:18px}.toolbar h2{font-size:19px;margin:0}.primary,.secondary,.danger,.quiet{border:0;border-radius:11px;padding:11px 15px;font:inherit;font-size:14px;font-weight:650;cursor:pointer}.primary{background:#123c50;color:white}.secondary{background:#e8f1f4;color:#164357}.danger{background:#fff0f0;color:#a52b35;padding:7px 10px}.quiet{background:transparent;color:#687783;padding:7px 10px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:17px}.metric{background:#fff;border:1px solid #e7edf0;border-radius:16px;padding:17px 19px;box-shadow:0 4px 15px #193a4a08}.metric span{display:block;color:#70818c;font-size:13px}.metric strong{display:block;font-size:clamp(19px,2.5vw,26px);margin-top:7px;font-variant-numeric:tabular-nums}.metric.income strong{color:#147247}.metric.expenses strong{color:#b4443b}.filter-bar{display:flex;justify-content:flex-end;margin:-4px 0 8px}.filter-toggle{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:#536773;font:inherit;font-size:13px;font-weight:650;padding:7px 2px;cursor:pointer}.filter-count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#e8f1f4;color:#164357;font-size:11px}.filter-count[hidden]{display:none}.filters{display:grid;grid-template-columns:minmax(190px,1.5fr) repeat(2,minmax(130px,.7fr)) minmax(155px,1fr) auto;gap:10px;background:#fff;border:1px solid #e7edf0;border-radius:16px;padding:13px;margin-bottom:15px;max-height:260px;opacity:1;overflow:hidden;transition:max-height .28s ease,opacity .2s ease,padding .28s ease,margin .28s ease,border-color .28s ease}.filters.is-collapsed{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-bottom:0;border-color:transparent;pointer-events:none}.input,select{min-width:0;width:100%;height:43px;border:1px solid #dce4e8;border-radius:10px;padding:0 11px;background:#fff;color:#172b3a;font:inherit}.input:focus,select:focus{outline:3px solid #16728b20;border-color:#16728b}.clear{height:43px;border:0;background:#edf2f4;border-radius:10px;padding:0 14px;cursor:pointer;color:#42525c;font-weight:600}.results-head{display:flex;justify-content:space-between;align-items:center;color:#71808c;font-size:13px;margin:12px 2px}.list{display:grid;gap:12px}.client{background:#fff;border:1px solid #e4ebee;border-radius:17px;padding:17px 18px;box-shadow:0 5px 18px #193a4a09}.client-top{display:flex;justify-content:space-between;gap:12px}.client-name{font-size:17px;font-weight:760}.client-car{margin-top:4px;color:#536773}.client-meta{display:flex;gap:14px;flex-wrap:wrap;color:#75838c;font-size:13px;margin-top:11px}.money-row{border-top:1px solid #edf0f2;margin-top:14px;padding-top:13px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.money-row div span{display:block;color:#78858d;font-size:12px}.money-row b{display:block;margin-top:4px;font-variant-numeric:tabular-nums}.money-row .remain{color:#13734b}.actions{display:flex;gap:4px;align-items:flex-start}.expense-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;font-size:13px;font-weight:720}.expense-list{margin-top:8px;border-top:1px solid #edf0f2}.expense{display:grid;grid-template-columns:minmax(100px,1fr) 105px 115px auto;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f0f2f3;font-size:13px}.expense .amount{text-align:right;color:#aa453d;font-weight:700;font-variant-numeric:tabular-nums}.expense time{color:#7b8991}.empty-expenses,.empty{color:#84919a;font-size:13px;padding:12px 0}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:20px}.pager button{border:1px solid #dce4e8;border-radius:10px;background:#fff;padding:9px 13px;cursor:pointer}.pager button:disabled{opacity:.45;cursor:default}.notice{display:none;padding:12px 15px;border-radius:11px;margin:0 0 14px}.notice.error{display:block;background:#fff0f0;color:#a52b35}.notice.ok{display:block;background:#eaf7ef;color:#167246}.overlay{position:fixed;inset:0;background:#10243177;display:flex;align-items:center;justify-content:center;padding:14px;z-index:10;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease,visibility 0s linear .22s}.overlay.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .22s ease,visibility 0s}.dialog{width:min(100%,500px);background:#fff;border-radius:20px;padding:20px;box-shadow:0 25px 80px #071b2877;max-height:calc(100dvh - 28px);overflow:auto;opacity:0;transform:translateY(18px) scale(.98);transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s ease}.overlay.open .dialog{opacity:1;transform:translateY(0) scale(1)}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.dialog-head h2{font-size:18px;margin:0}.close{border:0;background:#eef2f4;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}.form-grid{display:grid;gap:13px}.field label{display:block;font-size:13px;font-weight:650;margin:0 0 6px}.field .input,.field select{height:46px}.form-actions{display:flex;gap:9px;margin-top:17px}.form-actions button{flex:1;min-height:46px}.loading{padding:30px;text-align:center;color:#7e8c95}.balance-negative{color:#b4443b!important}@media(max-width:650px){.top{padding:14px 16px}.top h1{font-size:19px}.wrap{padding:17px 13px 40px}.toolbar{align-items:flex-start}.toolbar h2{font-size:18px}.toolbar .primary{padding:11px 12px;white-space:nowrap}.summary{grid-template-columns:1fr;gap:8px}.metric{padding:12px 15px;display:flex;align-items:center;justify-content:space-between}.metric strong{font-size:18px;margin:0;text-align:right}.filters{grid-template-columns:1fr 1fr;gap:8px;padding:10px}.filters .search{grid-column:1/-1}.clear{grid-column:1/-1}.client{padding:14px}.client-top{gap:7px}.client-name{font-size:16px}.money-row{gap:5px}.money-row b{font-size:13px}.money-row div span{font-size:11px}.expense{grid-template-columns:minmax(70px,1fr) auto auto;gap:6px;font-size:12px}.expense time{grid-column:1;grid-row:2}.expense .amount{grid-column:2;grid-row:1/3}.expense .actions{grid-column:3;grid-row:1/3}.expense .actions button{padding:5px}.overlay{padding:14px;align-items:center}.dialog{border-radius:20px;padding:19px 16px calc(18px + env(safe-area-inset-bottom));max-height:90dvh}.client-top .actions{flex-direction:column}}@media(prefers-reduced-motion:reduce){.overlay,.dialog,.filters{transition:none!important}}
  </style>
</head>
<body>
  <header class="top"><form method="post" action="{% url 'accountant-logout' %}">{% csrf_token %}<button class="logout" type="submit">Выйти</button></form></header>
  <main class="wrap">
    <div class="toolbar"><button class="primary" id="add-client">＋ Добавить клиента</button></div>
    <div id="notice" class="notice"></div>
    <section class="summary"><div class="metric income"><span>Приход сертификатов</span><strong id="sum-income">—</strong></div><div class="metric expenses"><span>Расходы</span><strong id="sum-expenses">—</strong></div><div class="metric"><span>Остаток кассы</span><strong id="sum-balance">—</strong></div></section>
    <div class="filter-bar"><button class="filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="filters-panel"><span id="filter-toggle-label">Показать фильтры</span><span class="filter-count" id="filter-count" hidden>0</span><span aria-hidden="true" id="filter-chevron">⌄</span></button></div><section class="filters is-collapsed" id="filters-panel" aria-hidden="true" inert><input class="input search" id="search" placeholder="Поиск: клиент или машина" autocomplete="off"><input class="input" id="date-from" type="date" aria-label="Дата с"><input class="input" id="date-to" type="date" aria-label="Дата по"><select class="input" id="manager-filter" aria-label="Фильтр по менеджеру"><option value="">Все менеджеры</option><option value="none">Без менеджера</option></select><button class="clear" id="clear-filters">Сбросить фильтры</button></section>
    <div class="results-head"><span id="result-count">Загрузка…</span><span>По 50 записей</span></div>
    <section class="list" id="clients"><div class="loading">Загрузка данных…</div></section>
    <nav class="pager" aria-label="Страницы"><button id="prev">Назад</button><span id="page-label">1 / 1</span><button id="next">Далее</button></nav>
  </main>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true"><section class="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="close" id="close-dialog" aria-label="Закрыть">×</button></div><form id="edit-form"><div class="form-grid" id="form-fields"></div><div class="form-actions"><button type="button" class="secondary" id="cancel-dialog">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form></section></div>
  <script>
    const apiUrl = "{% url 'accountant-api' %}";
    const csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;
    const today = new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Tashkent'});
    const state = {page:1,pages:1,managers:[],rows:[],timer:null,requestId:0};
    const el = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = value => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(value||0))+' сум';
    const showNotice = (text,kind='error') => {const n=el('notice');n.textContent=text;n.className='notice '+kind;setTimeout(()=>n.className='notice',3500)};
    function setManagers(managers){const select=el('manager-filter'),selected=select.value;select.innerHTML='<option value="">Все менеджеры</option><option value="none">Без менеджера</option>';managers.forEach(m=>{const option=document.createElement('option');option.value=m.id;option.textContent=m.name;select.append(option)});select.value=selected==='none'||managers.some(m=>String(m.id)===selected)?selected:''}
    function updateFilterIndicator(){const count=[el('search').value,el('date-from').value,el('date-to').value,el('manager-filter').value].filter(Boolean).length;el('filter-count').hidden=!count;el('filter-count').textContent=count;el('filter-toggle-label').textContent=el('filters-panel').classList.contains('is-collapsed')?'Показать фильтры':'Скрыть фильтры'}
    async function load(page=1){state.page=page;const requestId=++state.requestId;const params=new URLSearchParams({page,q:el('search').value,from:el('date-from').value,to:el('date-to').value,manager:el('manager-filter').value});try{const r=await fetch(apiUrl+'?'+params,{headers:{'X-Requested-With':'XMLHttpRequest'}});if(!r.ok)throw new Error('Не удалось загрузить список.');const data=await r.json();if(requestId!==state.requestId)return;state.pages=data.pages||1;state.managers=data.managers;setManagers(data.managers);updateFilterIndicator();state.rows=data.results;el('sum-income').textContent=money(data.income);el('sum-expenses').textContent=money(data.expenses);el('sum-balance').textContent=money(data.balance);el('result-count').textContent=`Найдено: ${data.total}`;el('page-label').textContent=`${data.page} / ${data.pages}`;el('prev').disabled=data.page<=1;el('next').disabled=data.page>=data.pages;render(data.results)}catch(e){if(requestId!==state.requestId)return;el('clients').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
    function render(rows){if(!rows.length){el('clients').innerHTML='<div class="empty">Клиенты не найдены. Добавьте первую запись.</div>';return}el('clients').innerHTML=rows.map(c=>`<article class="client"><div class="client-top"><div><div class="client-name">${esc(c.name)}</div><div class="client-car">${esc(c.vehicle)}</div><div class="client-meta"><span>Менеджер: ${esc(c.manager||'—')}</span><span>Дата: ${esc(c.date)}</span></div></div><div class="actions"><button class="quiet" data-action="edit-client" data-id="${c.id}">Изменить</button><button class="danger" data-action="delete-client" data-id="${c.id}">Удалить</button></div></div><div class="money-row"><div><span>Сертификат</span><b>${money(c.certificate)}</b></div><div><span>Расходы</span><b>${money(c.expense_total)}</b></div><div><span>Остаток клиента</span><b class="remain ${Number(c.balance)<0?'balance-negative':''}">${money(c.balance)}</b></div></div><div class="expense-head"><span>Расходы (${c.expenses.length})</span><button class="secondary" data-action="add-expense" data-id="${c.id}">＋ Расход</button></div>${c.expenses.length?`<div class="expense-list">${c.expenses.map(x=>`<div class="expense"><span>${esc(x.description)}</span><time>${esc(x.date)}</time><span class="amount">− ${money(x.amount)}</span><span class="actions"><button class="quiet" data-action="edit-expense" data-id="${x.id}" data-client="${c.id}">✎</button><button class="danger" data-action="delete-expense" data-id="${x.id}">×</button></span></div>`).join('')}</div>`:'<div class="empty-expenses">Расходов пока нет</div>'}</article>`).join('')}
    function openDialog(title,fields,initial={},hidden={}){el('dialog-title').textContent=title;el('form-fields').innerHTML=fields.map(f=>{let value=initial[f.name]??f.value??'';if(f.type==='select')return `<div class="field"><label for="f-${f.name}">${f.label}</label><select class="input" id="f-${f.name}" name="${f.name}" ${f.required?'required':''}>${f.options.map(o=>`<option value="${esc(o.value)}" ${String(value)===String(o.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;return `<div class="field"><label for="f-${f.name}">${f.label}</label><input class="input" id="f-${f.name}" name="${f.name}" type="${f.type||'text'}" value="${esc(value)}" ${f.required?'required':''} ${f.step?`step="${f.step}"`:''} ${f.min?`min="${f.min}"`:''}></div>`}).join('')+Object.entries(hidden).map(([k,v])=>`<input type="hidden" name="${k}" value="${esc(v)}">`).join('');el('overlay').classList.add('open');setTimeout(()=>el('form-fields').querySelector('input,select')?.focus(),50)}
    function closeDialog(){el('overlay').classList.remove('open')}
    function formFields(name,vehicle,manager,date,amount){return [{name:'name',label:'Имя клиента',required:true},{name:'vehicle',label:'Название машины',required:true},{name:'manager',label:'Менеджер',type:'select',options:[{value:'',label:'Выберите менеджера'},...state.managers.map(m=>({value:m.id,label:m.name}))]},{name:'date',label:'Дата клиента',type:'date',value:today,required:true},{name:'amount',label:'Сумма сертификата, сум',type:'number',step:'0.01',min:'0',required:true}]}
    el('add-client').onclick=()=>{el('edit-form').dataset.kind='client';openDialog('Новый клиент',formFields(),{date:today,amount:'0'},{action:'save_client'})};
    el('clients').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;const row=state.rows.find(x=>String(x.id)===(action==='edit-expense'?b.dataset.client:id));if(action==='edit-client'){if(!row)return;el('edit-form').dataset.kind='client';openDialog('Изменить клиента',formFields(),{name:row.name,vehicle:row.vehicle,manager:row.manager_id||'',date:row.date,amount:row.certificate},{action:'save_client',id})}else if(action==='add-expense'){el('edit-form').dataset.kind='expense';openDialog('Расход клиента',[{name:'description',label:'Описание расхода',required:true},{name:'amount',label:'Сумма, сум',type:'number',step:'0.01',min:'0.01',required:true},{name:'date',label:'Дата расхода',type:'date',value:today,required:true}],{date:today},{action:'save_expense',client_id:id})}else if(action==='edit-expense'){const expense=row?.expenses.find(x=>String(x.id)===id);if(!expense){showNotice('Расход не найден');return}el('edit-form').dataset.kind='expense';openDialog('Изменить расход',[{name:'description',label:'Описание расхода',required:true},{name:'amount',label:'Сумма, сум',type:'number',step:'0.01',min:'0.01',required:true},{name:'date',label:'Дата расхода',type:'date',required:true}],{description:expense.description,amount:expense.amount,date:expense.date},{action:'save_expense',client_id:b.dataset.client,id})}else if(action.startsWith('delete-')){if(!confirm(action==='delete-client'?'Удалить клиента вместе со всеми его расходами?':'Удалить этот расход?'))return;const fd=new FormData();fd.set('action',action.replace('-','_'));fd.set('id',id);try{const r=await fetch(apiUrl,{method:'POST',headers:{'X-CSRFToken':csrf},body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error);showNotice('Удалено','ok');load(state.page)}catch(err){showNotice(err.message)}}});
    el('edit-form').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);try{const r=await fetch(apiUrl,{method:'POST',headers:{'X-CSRFToken':csrf},body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error);closeDialog();showNotice('Сохранено','ok');load(fd.get('action')==='save_client'&&!fd.get('id')?1:state.page)}catch(err){showNotice(err.message)}});
    el('filter-toggle').onclick=()=>{const collapsed=el('filters-panel').classList.toggle('is-collapsed');el('filter-toggle').setAttribute('aria-expanded',String(!collapsed));el('filters-panel').setAttribute('aria-hidden',String(collapsed));el('filters-panel').inert=collapsed;updateFilterIndicator()};el('close-dialog').onclick=el('cancel-dialog').onclick=closeDialog;el('overlay').addEventListener('click',e=>{if(e.target===el('overlay'))closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});el('prev').onclick=()=>load(state.page-1);el('next').onclick=()=>load(state.page+1);for(const id of ['date-from','date-to','manager-filter'])el(id).addEventListener('change',()=>{clearTimeout(state.timer);updateFilterIndicator();load(1)});el('search').addEventListener('input',()=>{updateFilterIndicator();clearTimeout(state.timer);state.timer=setTimeout(()=>load(1),250)});el('clear-filters').onclick=()=>{clearTimeout(state.timer);el('search').value='';el('date-from').value='';el('date-to').value='';el('manager-filter').value='';updateFilterIndicator();load(1)};updateFilterIndicator();load();
  </script>
</body></html>
