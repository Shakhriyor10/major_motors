<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f42"><title>Кабинет бухгалтера · Major Motors</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172b3a;background:#f3f6f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.top{height:58px;background:linear-gradient(110deg,#102f42,#176078);display:flex;align-items:center;justify-content:flex-end;padding:0 max(16px,calc((100% - 920px)/2))}.logout{color:#fff;border:1px solid #ffffff66;border-radius:9px;padding:8px 12px;background:none;font:inherit;font-size:13px;font-weight:650;cursor:pointer}.wrap{max-width:920px;margin:0 auto;padding:30px 18px 55px}.eyebrow{margin:0 0 7px;color:#16728b;font-size:11px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}.title{margin:0;font-size:clamp(27px,4vw,36px);letter-spacing:-.03em}.intro{margin:7px 0 24px;color:#71808c;font-size:14px}.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.link-card{display:flex;align-items:center;justify-content:space-between;gap:13px;min-height:92px;padding:15px 17px;background:#fff;border:1px solid #e5ecef;border-radius:15px;text-decoration:none;color:inherit;box-shadow:0 5px 18px #193a4a08;transition:transform .18s ease,border-color .18s ease}.link-card:hover{transform:translateY(-2px);border-color:#b8d3dc}.link-main{display:flex;align-items:center;gap:12px}.icon{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:13px;background:#eaf2f5;color:#164357}.icon svg{width:21px;height:21px}.link-title{display:block;font-size:14px;font-weight:740}.link-description{display:block;margin-top:4px;color:#77858e;font-size:11px;line-height:1.4}.arrow{color:#83919a;font-size:19px}@media(max-width:600px){.top{height:54px;padding:0 13px}.wrap{padding:23px 12px 40px}.intro{font-size:13px;margin-bottom:18px}.links{grid-template-columns:1fr;gap:9px}.link-card{min-height:80px;padding:12px 13px}}
@media(prefers-reduced-motion:reduce){.link-card{transition:none!important}}
</style>
</head>
<body>
<header class="top"><form method="post" action="{% url 'accountant-logout' %}">{% csrf_token %}<button class="logout" type="submit">Выйти</button></form></header>
<main class="wrap"><p class="eyebrow">Major Motors · Бухгалтерия</p><h1 class="title">Главная</h1><p class="intro">Выберите нужный раздел бухгалтерии.</p>
<nav class="links" aria-label="Разделы бухгалтерии">
<a class="link-card" href="{% url 'accountant-clients' %}"><span class="link-main"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span><span class="link-title">Клиенты и сертификаты</span><span class="link-description">Клиенты, приход и расходы по ним</span></span></span><span class="arrow" aria-hidden="true">→</span></a>
<a class="link-card" href="{% url 'accountant-expenses' %}"><span class="link-main"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="m9 12 2 2 4-4"/></svg></span><span><span class="link-title">Прочие расходы</span><span class="link-description">Общая касса, приходы и журнал всех расходов</span></span></span><span class="arrow" aria-hidden="true">→</span></a>
<a class="link-card" href="{% url 'accountant-salary' %}"><span class="link-main"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/><circle cx="16.5" cy="14.5" r="1.5"/></svg></span><span><span class="link-title">Зарплаты сотрудников</span><span class="link-description">Зарплаты, авансы и остаток по сотрудникам</span></span></span><span class="arrow" aria-hidden="true">→</span></a>
</nav></main>
</body></html>
